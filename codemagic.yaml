# Codemagic CI configuration — faithful translation of the "Default Workflow"
# from the Codemagic Workflow Editor (read from the UI on 2026-08-21).
#
# NOTE: this file is NOT active until the app is switched to YAML mode in the
# Codemagic UI ("Switch to YAML configuration" on the app's settings page).
# Until then the Workflow Editor remains the source of truth and this file is
# documentation + a migration path.
#
# Secrets are deliberately NOT in this file. They come from environment
# variable groups (checked in the Codemagic UI on 2026-08-23):
#   aws_credentials    (team global): AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   google_credentials (team global): GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
#                       (also holds GCLOUD_SERVICE_ACCOUNT_CREDENTIALS, but
#                       that value failed Codemagic's JSON validation - yaml
#                       build #1 - so the GOOGLE_PLAY_ one, which the old
#                       workflow editor demonstrably published with, is used)
#   nuptialflight      (app level, Team settings > the app > Environment
#                       variables): OPENWEATHERMAP_API_KEY,
#                       OPENWEATHERMAP_MAP_KEY, MAPTILER_MAP_KEY,
#                       NF_API_KEY (required from 2.29.0: the scoped app key
#                       for the reporting REST API; must equal one of the
#                       server's NF_APP_KEYS or every call returns 401 and
#                       the app silently loses reporting, map markers and
#                       nearby alerts), NF_API_URL (optional override),
#                       CODEMAGIC_API_TOKEN (Account settings > Integrations >
#                       Codemagic API; powers the build guard below)
# The Create assets/.env step fails fast when any required key is missing so
# a keyless web build can never reach production, and names the missing
# variable. (The `|| true` in that step matters: without it an UNSET
# variable makes `printenv` fail under `set -e`, and the step dies with a
# bare "exited with status code 1" before the message can print.)
# Android signing references the team keystore `nuptialflight_upload`
# (Team settings > Code signing identities > Android keystores; the app's
# Play upload key - Google rejected android_bitbot.jks as the wrong key in
# yaml build #7). The App
# Store Connect API key "Codemagic Nuptial Flight" (75423D3XRN) exists in
# team integrations and is referenced by name below.
#
# Parity note: the Workflow Editor also publishes the web build to Codemagic
# Static Pages (subdomain `nuptialflight.codemagic.app`). Static Pages has no
# YAML publishing equivalent; the S3 deploy below covers the production site
# (bucket `nuptialflight.app`).

workflows:
  default-workflow:
    name: Default Workflow
    instance_type: mac_mini_m4
    max_build_duration: 60

    environment:
      groups:
        - aws_credentials
        - google_credentials
        - nuptialflight
      vars:
        JAVA_HOME: /Library/Java/JavaVirtualMachines/zulu-17.jdk/Contents/Home
        PACKAGE_NAME: au.com.bitbot.nuptialflight
      flutter: stable
      xcode: latest
      cocoapods: default
      android_signing:
        - nuptialflight_upload
      ios_signing:
        distribution_type: app_store
        bundle_identifier: au.com.bitbot.nuptialflight

    integrations:
      app_store_connect: Codemagic Nuptial Flight

    cache:
      cache_paths:
        - $HOME/Library/Caches/CocoaPods
        - $HOME/.gradle/caches
        - $FLUTTER_ROOT/.pub-cache

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true
      cancel_previous_builds: false

    scripts:
      # Build guard: every push to master used to run a full build and then
      # fail at publishing with a duplicate build number. Build only when the
      # pubspec version differs from the last SUCCESSFUL build on this branch
      # (status finished, or warning: built but a publishing step failed);
      # otherwise cancel this build via the Codemagic API. A failed build
      # needs no special case: it published nothing, so its version still
      # differs from the last success and the next push retries it.
      # Escape hatches: "[force build]" in the commit message builds
      # regardless; Codemagic's native "[skip ci]" skips before this runs.
      # Without CODEMAGIC_API_TOKEN the guard is inert and every build runs.
      # nf-3xk (2026-10-29): the guard used to take the newest completed build
      # of ANY branch and any status, so a failed build elsewhere made a
      # same-version master push (#44) build in full and fail at publishing.
      - name: Build guard
        script: |
          #!/bin/sh
          if [ -z "$CODEMAGIC_API_TOKEN" ]; then
            echo "Build guard: CODEMAGIC_API_TOKEN not set - building."
            exit 0
          fi
          COMMIT_MSG=$(git log -1 --pretty=%B 2>/dev/null)
          case "$COMMIT_MSG" in
            *"[force build]"*)
              echo "Build guard: [force build] flag - building."
              exit 0 ;;
          esac
          # Workflow-editor builds may only define the legacy FCI_* names.
          APP_ID="${CM_PROJECT_ID:-${FCI_PROJECT_ID:-61d52f9fd1be809cfdf62648}}"
          BUILD_ID="${CM_BUILD_ID:-$FCI_BUILD_ID}"
          BRANCH="${CM_BRANCH:-$FCI_BRANCH}"
          RESP=$(curl -s --max-time 30 -w "HTTPCODE:%{http_code}" -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
            "https://api.codemagic.io/builds?appId=$APP_ID&limit=50")
          HTTP_CODE=${RESP##*HTTPCODE:}
          BUILDS_JSON=${RESP%HTTPCODE:*}
          PREV=$(echo "$BUILDS_JSON" | BUILD_ID="$BUILD_ID" BRANCH="$BRANCH" python3 -c '
          import json, sys, os
          me, branch = os.environ.get("BUILD_ID", ""), os.environ.get("BRANCH", "")
          try:
              builds = json.load(sys.stdin).get("builds", [])
          except Exception:
              builds = []
          for b in builds:
              if b.get("_id") == me or b.get("branch") != branch:
                  continue
              if b.get("status") in ("finished", "warning"):
                  print(b.get("status"), (b.get("commit") or {}).get("hash", ""))
                  break
          ')
          PREV_STATUS=$(echo "$PREV" | cut -d" " -f1)
          PREV_COMMIT=$(echo "$PREV" | cut -d" " -f2)
          if [ -z "$PREV_COMMIT" ]; then
            echo "Build guard: no successful build on '$BRANCH' in the last 50 (HTTP $HTTP_CODE, appId $APP_ID, buildId $BUILD_ID) - building."
            echo "Build guard: body head: $(echo "$BUILDS_JSON" | cut -c1-300)"
            exit 0
          fi
          # The clone may be shallow; fetch the commit before reading it.
          git cat-file -e "$PREV_COMMIT^{commit}" 2>/dev/null \
            || git fetch -q --depth=1 origin "$PREV_COMMIT" 2>/dev/null || true
          CUR_VER=$(grep "^version:" pubspec.yaml)
          PREV_VER=$(git show "$PREV_COMMIT:pubspec.yaml" 2>/dev/null | grep "^version:")
          if [ -z "$PREV_VER" ]; then
            echo "Build guard: cannot read the version of $PREV_COMMIT (last $PREV_STATUS build on '$BRANCH') - building."
          elif [ "$CUR_VER" = "$PREV_VER" ]; then
            echo "Build guard: $CUR_VER already built by $PREV_COMMIT (last $PREV_STATUS build on '$BRANCH') - cancelling."
            curl -s -X POST -H "x-auth-token: $CODEMAGIC_API_TOKEN" \
              "https://api.codemagic.io/builds/$BUILD_ID/cancel"
            sleep 60
          else
            echo "Build guard: version changed ($PREV_VER -> $CUR_VER) since the last $PREV_STATUS build on '$BRANCH' - building."
          fi
      # Workflow Editor parity: the post-clone script that creates the
      # gitignored assets/.env the app (and its tests) require to build.
      - name: Create assets/.env
        script: |
          #!/bin/sh
          set -e
          # Fail fast rather than build (and deploy!) a keyless app.
          for var in OPENWEATHERMAP_API_KEY OPENWEATHERMAP_MAP_KEY MAPTILER_MAP_KEY NF_API_KEY; do
            val=$(printenv "$var" || true)
            if [ -z "$val" ]; then
              echo "ERROR: $var is empty. Add it to the app-level 'nuptialflight'"
              echo "environment variable group (see header of codemagic.yaml)."
              exit 1
            fi
          done
          # Truncate any checkout copy first. Only client API and weather keys
          # may enter the public Flutter asset; never print their values.
          : > assets/.env
          printf 'OPENWEATHERMAP_API_KEY=%s\n' "$OPENWEATHERMAP_API_KEY" >> assets/.env
          printf 'OPENWEATHERMAP_MAP_KEY=%s\n' "$OPENWEATHERMAP_MAP_KEY" >> assets/.env
          printf 'MAPTILER_MAP_KEY=%s\n' "$MAPTILER_MAP_KEY" >> assets/.env
          printf 'NF_API_URL=%s\n' "${NF_API_URL:-https://api.bitbot.com.au/nuptialflight/v1}" >> assets/.env
          printf 'NF_API_KEY=%s\n' "$NF_API_KEY" >> assets/.env
          # The asset must hold exactly these five keys, one per line. What
          # can actually break that is a secret pasted with a line break: it
          # splits one key across two lines and ships an app whose every
          # reporting call is a silent 401. (The check this replaces grepped
          # for ARANGO_ in a file just rewritten from fixed names, so it could
          # never match.) Report the count only: a stray line is a fragment
          # of a secret and must not reach the build log.
          keys=$(grep -v '^$' assets/.env | cut -d= -f1 | LC_ALL=C sort | tr '\n' ' ')
          if [ "$keys" != "MAPTILER_MAP_KEY NF_API_KEY NF_API_URL OPENWEATHERMAP_API_KEY OPENWEATHERMAP_MAP_KEY " ]; then
            echo "ERROR: assets/.env must hold exactly 5 keys, one per line, but has"
            echo "$(grep -c . assets/.env) non-empty lines or an unexpected key name."
            echo "Check the 'nuptialflight' variable group for a value with a line break."
            exit 1
          fi
      - name: Get Flutter packages
        script: flutter packages pub get
      # Workflow Editor: "Integration and unit tests" with arguments `test`,
      # "Stop build if tests or analysis fail" checked (the default: a failing
      # script fails the build). Static code analysis was disabled.
      - name: Flutter test
        script: flutter test
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      # android/app/build.gradle reads android/key.properties, which the old
      # Workflow Editor wrote automatically. yaml android_signing provides the
      # CM_KEYSTORE_* variables instead, so recreate the file from them.
      - name: Create android/key.properties
        script: |
          #!/bin/sh
          set -e
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: CM_KEYSTORE_PATH is empty - android_signing did not provide a keystore."
            exit 1
          fi
          cat > android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Build AAB (release)
        script: flutter build appbundle --release
      # Web before iOS: a broken Apple signing setup must not block the
      # production web deploy.
      - name: Build web (release)
        script: |
          #!/bin/sh
          set -e
          flutter build web --release
          cd build/web
          zip -r ../web.zip .
      - name: Deploy web to S3 (nuptialflight.app)
        script: |
          #!/usr/bin/env sh
          set -e
          # Hashed/immutable-ish assets may cache for a day; the entry files
          # must revalidate on every load or Cloudflare AND returning
          # browsers serve a stale app for up to 4h after a release (S3
          # objects carry no Cache-Control by default, so Cloudflare's 4h
          # browser TTL fills the vacuum).
          aws s3 sync build/web s3://nuptialflight.app --delete --cache-control "public, max-age=86400"
          for f in index.html flutter_bootstrap.js flutter.js main.dart.js flutter_service_worker.js version.json; do
            if [ -f "build/web/$f" ]; then
              aws s3 cp "build/web/$f" "s3://nuptialflight.app/$f" --cache-control "no-cache"
            fi
          done
      - name: Build IPA (release)
        script: flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
      - build/ios/ipa/*.ipa
      - build/web.zip
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - brushworth@bitbot.com.au
        notify:
          success: true
          failure: true
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        # Internal testing, not open testing: releases reach the internal
        # tester list only, so a bad build never lands in front of the public
        # beta audience. Promote to a wider track from the Play Console.
        track: internal
        submit_as_draft: false
      app_store_connect:
        auth: integration
        # TestFlight internal testers only (the "App Store Connect Users"
        # group picks builds up automatically). Deliberately no beta_groups:
        # naming an external group here would push every master build to
        # public testers, the iOS equivalent of Play open testing. The only
        # external group is "Facebook"; promote to it from App Store Connect.
        # (A non-existent group `nuptialflight` was listed here and silently
        # did nothing - the real group names are above.)
        submit_to_testflight: true
        submit_to_app_store: false
